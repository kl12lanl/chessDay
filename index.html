<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessDay — Играй в шахматы 2026 </title>

    <!-- Chess.js для базовой логики доски на главной -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-header: #121212;
            --bg-glass: rgba(255, 255, 255, 0.02);
            --text-white: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-gradient: linear-gradient(135deg, #10b981, #3b82f6);
            --accent-green: #10b981;
            --board-light: #f0d9b5;
            --board-dark: #b58863;
            --border: #2b2b2b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main);
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* === 1. ШАПКА (HEADER) === */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-white);
        }

        /* === 2. ГЕРОЙ-СЕКЦИЯ (ЦЕНТР ЭКРАНА) === */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .hero-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Кнопка ИГРАТЬ */
        .btn-play {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-play:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-play:active {
            transform: translateY(-2px);
        }

        /* === 3. ДОСКА НА ГЛАВНОЙ (ДЕКОР) */
        .hero-board {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            opacity: 0.6;
            pointer-events: none;
        }

        #hero-chessboard {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .hero-square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .hero-light { background: var(--board-light); }
        .hero-dark { background: var(--board-dark); }

        .hero-piece {
            transition: transform 0.3s ease;
        }

        /* === АДАПТИВНОСТЬ === */
        @media (max-width: 768px) {
            .header { padding: 0 20px; }
            h1 { font-size: 2.2rem; }
            .hero-glass { padding: 40px 20px; }
            .hero-board { width: 150px; height: 150px; right: 10px; bottom: 10px; }
            #hero-chessboard { font-size: 14px; }
        }
    </style>
</head>

<script>

    const chatInput = document.getElementById('chat-input');

    // Имитация авторизации (для примера работы блокировки ввода)
    // В реальном приложении статус должен приходить от вашей системы аутентификации
    let isAuthenticated = true; 

    if (isAuthenticated) {
        chatInput.disabled = false;
        chatInput.placeholder = "Введите сообщение...";
        sendBtn.disabled = false;
    }

    // Функция отправки сообщения
    function sendMessage() {
        const text = chatInput.value.trim();
        if (text) {
            // Отправляем событие на сервер
            socket.emit('chatMessage', { text: text });
            chatInput.value = '';
        }
    }

    // Слушаем клик по кнопке и нажатие Enter
    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Получение сообщения от сервера и вывод на экран
    socket.on('message', (message) => {
        const msgElement = document.createElement('div');
        msgElement.innerHTML = `<strong>${message.user}:</strong> ${message.text}`;
        chatMessages.appendChild(msgElement);
        
        // Автопрокрутка чата вниз
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });
